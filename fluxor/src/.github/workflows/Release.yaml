name: Build and Release fluxor

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: 修改 package.json 版本号（追加 commit 哈希）
        run: |
          HASH=$(git rev-parse --short HEAD)
          VERSION=$(jq -r '.version' frontend/package.json)
          NEW_VERSION="${VERSION}~${HASH}"
          jq --arg new "$NEW_VERSION" '.version = $new' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          echo "新版本号: $NEW_VERSION"

      - name: 构建前端 (frontend)
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: 同步前端构建产物到 backend/dist
        run: |
          rm -rf backend/dist
          mkdir -p backend
          cp -r frontend/dist backend/dist

      - name: 构建 Go 后端（${{ matrix.arch }}）
        working-directory: ./backend
        run: |
          GOOS=linux CGO_ENABLED=0 GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o ../fluxor-${{ matrix.arch }}

      - name: 上传 fluxor-${{ matrix.arch }} 作为 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: fluxor-${{ matrix.arch }}
          path: fluxor-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: 检出源码（用于读取版本号和 commit 日志）
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 读取 package.json 中的版本号
        id: get_version
        run: |
          VERSION=$(jq -r '.version' frontend/package.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 生成 Release Notes（从上一个 tag 到现在的完整 commit 消息）
        id: get_notes
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            LAST_TAG=$(git describe --tags --abbrev=0)
            NOTES=$(git log ${LAST_TAG}..HEAD --pretty=format:"%B")
          else
            NOTES=$(git log --pretty=format:"%B")
          fi
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 下载所有构建产物
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: 创建或更新 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ steps.get_notes.outputs.NOTES }}
          files: artifacts/**/fluxor-*
          draft: false
          prerelease: false
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
